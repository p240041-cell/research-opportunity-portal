<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h1 class="h3 mb-0">Research Opportunity Portal</h1>
        <small>NUCES Peshawar &ndash; all research openings in one place</small>
      </div>
      <button class="btn btn-light" id="newBtn">Post opportunity</button>
    </div>
  </header>

  <main class="container my-4">
    <div id="alerts" aria-live="polite"></div>
    <div class="table-responsive bg-white border rounded">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr><th>Title</th><th>Faculty</th><th>Area</th><th>Positions</th><th>Deadline</th><th>Status</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <form id="oppForm" novalidate>
        <div class="modal-header"><h2 class="modal-title h5" id="formTitle">Post opportunity</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body row g-3">
          <input type="hidden" id="f_id">
          <div class="col-12"><label class="form-label" for="f_title">Research title</label>
            <input class="form-control" id="f_title" required></div>
          <div class="col-12"><label class="form-label" for="f_description">Description</label>
            <textarea class="form-control" id="f_description" rows="3" required></textarea></div>
          <div class="col-md-6"><label class="form-label" for="f_area">Research area</label>
            <input class="form-control" id="f_area" required></div>
          <div class="col-md-6"><label class="form-label" for="f_faculty">Faculty member</label>
            <input class="form-control" id="f_faculty" required></div>
          <div class="col-md-6"><label class="form-label" for="f_dept">Department</label>
            <input class="form-control" id="f_dept" required></div>
          <div class="col-md-6"><label class="form-label" for="f_skills">Required skills</label>
            <input class="form-control" id="f_skills" placeholder="Python, ML, ..." required></div>
          <div class="col-md-4"><label class="form-label" for="f_positions">Available positions</label>
            <input type="number" min="1" class="form-control" id="f_positions" required></div>
          <div class="col-md-4"><label class="form-label" for="f_deadline">Application deadline</label>
            <input type="date" class="form-control" id="f_deadline" required></div>
          <div class="col-md-4"><label class="form-label" for="f_status">Status</label>
            <select class="form-select" id="f_status"><option>Open</option><option>Closed</option></select></div>
          <div class="text-danger" id="formError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div></div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="d_title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="d_body"></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
